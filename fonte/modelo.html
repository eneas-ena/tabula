<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<script>/* VERSÃO DO APP — a busca automática de atualização compara com esta linha */
window.VERSAO = '0.5.1';
window.EXCALIDRAW_ASSET_PATH = ['https://esm.sh/@excalidraw/excalidraw@0.18.1/dist/prod/', 'https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@0.18.1/dist/prod/'];
try { document.documentElement.dataset.tema = localStorage.getItem('tb.tema') === 'escuro' ? 'escuro' : 'claro'; } catch (e) {}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tábula</title>
<meta name="theme-color" content="#0F1B33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tábula">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#0F1B33; --ouro:#C9A227;
  --fundo:#F3EFE6; --barra:#0F1B33; --barra-tx:#F4EBD3; --barra-sub:#A9B2C6;
  --painel:#FFFDF8; --tx:#1B2438; --sub:#6B6658; --borda:#E1DACB; --bt:#22314F;
  --sombra:0 10px 30px rgba(15,27,51,.16);
  --regua:#F7F4EC; --regua-tx:#7A7465; --regua-risco:#B9B2A2;
  --pontos:rgba(15,27,51,.22);
}
[data-tema="escuro"]{
  --fundo:#0A111F; --barra:#060C18; --painel:#17223A; --tx:#E9E4D6; --sub:#A7A08F; --borda:#2B3A57;
  --sombra:0 10px 30px rgba(0,0,0,.5);
  --regua:#121212; --regua-tx:#8C8C8C; --regua-risco:#4A4A4A;
  --pontos:rgba(255,255,255,.20);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--fundo);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
.oculto{display:none!important}

/* ---------- barra superior (tela das cenas) ---------- */
.barra{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
  background:var(--barra);color:var(--barra-tx);flex-wrap:wrap}
.marca{font-family:Cinzel,serif;font-weight:700;font-size:22px;color:var(--ouro);letter-spacing:.06em;margin-right:4px}
.versao{font-size:11px;color:var(--barra-sub)}
.barra .esp{flex:1}
.bt-ic{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:transparent;color:var(--barra-tx);
  display:inline-flex;align-items:center;justify-content:center;padding:0}
.bt-ic svg{width:20px;height:20px}
.bt-ouro{background:var(--ouro);color:var(--azul);border:none;border-radius:10px;padding:9px 14px;font-weight:600}
.busca{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--barra-tx);border-radius:10px;padding:8px 12px;width:200px;max-width:40vw;outline:none}
.busca::placeholder{color:var(--barra-sub)}

/* ---------- pastas ---------- */
.pastas{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--borda);background:var(--fundo);flex:none;scrollbar-width:none}
.pastas::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;flex:none;border:1px solid var(--borda);background:var(--painel);color:var(--tx);border-radius:20px;padding:7px 12px;font-size:14px;white-space:nowrap}
.chip svg{width:16px;height:16px;color:var(--ouro)}
.chip small{font-size:11px;color:var(--sub);background:var(--fundo);border-radius:10px;padding:1px 7px}
.chip.ativo{background:var(--azul);color:#F4EBD3;border-color:var(--azul)}
.chip.ativo small{background:rgba(255,255,255,.15);color:#F4EBD3}
[data-tema="escuro"] .chip.ativo{background:var(--ouro);color:var(--azul);border-color:var(--ouro)}
[data-tema="escuro"] .chip.ativo small{background:rgba(15,27,51,.15);color:var(--azul)}
.chip i{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;border-radius:6px;margin-right:-6px}
.chip i svg{color:currentColor}
.chip.novo{border-style:dashed;background:transparent;color:var(--sub)}
.cartao .mini{position:relative}
.selo-link{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:8px;background:var(--azul);color:var(--ouro);display:flex;align-items:center;justify-content:center}
.selo-link svg{width:16px;height:16px}
.tb-somente{font-weight:600;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default}

/* ---------- grade de cenas ---------- */
#telaCenas{position:fixed;inset:0;display:flex;flex-direction:column}
.rolagem{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px;padding-bottom:max(18px,env(safe-area-inset-bottom))}
.titulo-sec{font-family:"Cormorant Garamond",serif;font-size:22px;color:var(--sub);margin:2px 4px 14px;font-style:italic}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.cartao{background:var(--painel);border:1px solid var(--borda);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(15,27,51,.06);
  display:flex;flex-direction:column;cursor:pointer;position:relative}
.cartao:active{transform:scale(.99)}
.cartao .mini{aspect-ratio:16/10;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--borda)}
[data-tema="escuro"] .cartao .mini{background:#1E1E1E}
.cartao .mini img{width:100%;height:100%;object-fit:contain}
[data-tema="escuro"] .cartao .mini img{filter:invert(93%) hue-rotate(180deg)}
.cartao .mini .vazio{color:var(--sub);font-family:"Cormorant Garamond",serif;font-style:italic;font-size:18px}
.cartao .info{padding:10px 12px;display:flex;align-items:center;gap:6px}
.cartao .nome{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cartao .data{font-size:12px;color:var(--sub)}
.cartao .mais{width:32px;height:32px;border:none;background:transparent;border-radius:8px;color:var(--sub);flex:none}
.cartao .mais:hover{background:var(--borda)}
.cartao.nova{align-items:center;justify-content:center;border:2px dashed var(--borda);background:transparent;min-height:180px;color:var(--sub);font-weight:600;gap:8px}
.cartao.nova svg{width:34px;height:34px;color:var(--ouro)}
.vazio-lista{color:var(--sub);text-align:center;padding:40px 10px}

/* ---------- menus, modais, aviso ---------- */
.fundo-modal{position:fixed;inset:0;background:rgba(6,12,24,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--painel);color:var(--tx);border-radius:16px;box-shadow:var(--sombra);width:min(440px,100%);max-height:85vh;overflow:auto;padding:18px}
.modal h2{font-family:Cinzel,serif;font-size:18px;margin:0 0 12px;color:var(--tx)}
.modal .campo{width:100%;padding:10px 12px;border:1px solid var(--borda);border-radius:10px;background:var(--fundo);color:var(--tx);outline:none}
.modal .acoes{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.modal .bt{border:1px solid var(--borda);background:transparent;border-radius:10px;padding:9px 14px}
.modal .bt.pri{background:var(--azul);color:#fff;border-color:var(--azul)}
[data-tema="escuro"] .modal .bt.pri{background:var(--ouro);color:var(--azul);border-color:var(--ouro)}
.modal .bt.perigo{background:#B03A2E;color:#fff;border-color:#B03A2E}
.menu-flut{position:fixed;z-index:60;background:var(--painel);color:var(--tx);border:1px solid var(--borda);border-radius:12px;box-shadow:var(--sombra);padding:6px;min-width:190px}
.menu-flut button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:10px 12px;border-radius:8px}
.menu-flut button:hover{background:var(--fundo)}
.menu-flut .perigo{color:#C0392B}
.menu-flut .info{font-size:12px;color:var(--sub);padding:6px 12px}
.linha-aj{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--borda)}
.linha-aj:last-child{border-bottom:none}
.linha-aj .tx{flex:1;min-width:0}
.linha-aj small{color:var(--sub);display:block;overflow:hidden;text-overflow:ellipsis}
.selo{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--borda);color:var(--sub)}
.selo.ok{background:#1E9E50;color:#fff}
#aviso{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(calc(100% + 60px));z-index:80;visibility:hidden;
  background:var(--azul);color:#F4EBD3;padding:11px 14px;border-radius:12px;box-shadow:var(--sombra);display:flex;gap:12px;align-items:center;
  transition:transform .25s;max-width:92vw;font-size:14px}
#aviso.vis{transform:translateX(-50%) translateY(0);visibility:visible}
#aviso button{background:var(--ouro);color:var(--azul);border:none;border-radius:8px;padding:7px 12px;font-weight:600;white-space:nowrap}

/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:40;background:var(--azul);display:flex;align-items:center;justify-content:center;padding:20px}
#login form{width:min(360px,100%);background:#FFFDF8;color:#1B2438;border-radius:18px;padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#login h1{font-family:Cinzel,serif;color:var(--azul);text-align:center;margin:0;font-size:30px;letter-spacing:.06em}
#login .lema{text-align:center;font-family:"Cormorant Garamond",serif;font-style:italic;color:#6B6658;margin:4px 0 18px;font-size:17px}
#login label{display:block;font-size:13px;color:#6B6658;margin:10px 0 4px}
#login .campo{width:100%;padding:11px 12px;border:1px solid #E1DACB;border-radius:10px;background:#F7F3EA;color:#1B2438;outline:none}
#login button[type=submit]{width:100%;margin-top:16px;background:var(--azul);color:#F4EBD3;border:none;border-radius:10px;padding:12px;font-weight:600}
#login .link{display:block;margin:12px auto 0;background:none;border:none;color:var(--azul);text-decoration:underline;font-size:14px}
#login .erro{color:#B03A2E;font-size:13px;margin-top:10px;min-height:18px;text-align:center}
#login .ok{color:#1E9E50}
#login .ver{text-align:center;font-size:11px;color:#9A9384;margin-top:6px}

/* barra de cima enxuta em telas menores (o app decide o nível medindo o espaço) */
#telaEditor.c1 .tb-rot,#telaEditor.c1 .excalidraw .default-sidebar-trigger .sidebar-trigger__label{display:none!important}
#telaEditor.c1 .tb-topo .tb-titulo{width:120px}
#telaEditor.c2 .tb-topo .tb-titulo{display:none}
#telaEditor.c3 .tb-rot-ap{display:none}
#telaEditor.c4 .tb-topo .tb-opc{display:none}
/* iPad em pé: os botões da cena descem para o canto de baixo, ao lado da ajuda */
#telaEditor.c5 .tb-topo{position:fixed;right:64px;bottom:max(16px,env(safe-area-inset-bottom));z-index:5}
#telaEditor.c5 .tb-topo .tb-opc{display:inline-flex}

/* ---------- botão Enquadrar tudo ---------- */
.excalidraw .tb-enquadrar{border:none;background:transparent;padding:0;margin:0;cursor:pointer;color:var(--icon-fill-color)}
.excalidraw .tb-enquadrar .ToolIcon__icon{display:flex;align-items:center;justify-content:center}
.excalidraw .tb-enquadrar .ToolIcon__icon svg{width:var(--icon-size,1rem);height:var(--icon-size,1rem)}
.excalidraw .tb-enquadrar:hover .ToolIcon__icon{background:var(--button-hover-bg,var(--color-surface-mid))}

/* ---------- comentários ---------- */
.com-camada{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.com-captura{position:absolute;inset:0;pointer-events:auto;cursor:crosshair;background:rgba(201,162,39,.04)}
.com-pino{position:absolute;pointer-events:auto;width:30px;height:30px;margin:-30px 0 0 0;border:2px solid #fff;border-radius:15px 15px 15px 3px;
  background:#C9A227;color:#0F1B33;font:700 13px -apple-system,Segoe UI,sans-serif;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer;padding:0;transition:transform .1s}
.com-pino:hover,.com-pino.ativo{transform:scale(1.12);background:#0F1B33;color:#C9A227}
.com-pino.resolvido{background:#9AA3B5;color:#fff}
.com-pino.novo{background:#0F1B33;color:#C9A227;cursor:default}
.com-fio{position:absolute;pointer-events:auto;width:300px;margin:-30px 0 0 22px;background:var(--painel);color:var(--tx);border:1px solid var(--borda);
  border-radius:12px;box-shadow:var(--sombra);padding:10px;z-index:5;font-size:14px}
.com-fio.esq{margin-left:-312px}
.com-cab{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.com-cab b{flex:1;font-family:Cinzel,serif;font-size:13px}
.com-mini{width:28px;height:28px;border:none;border-radius:7px;background:transparent;color:var(--sub);font-size:13px;padding:0}
.com-mini:hover{background:var(--fundo)} .com-mini.ok{background:#1E9E50;color:#fff}
.com-lista{max-height:240px;overflow:auto;margin-bottom:8px}
.com-msg{padding:6px 0;border-bottom:1px solid var(--borda)}
.com-autor{font-weight:600;font-size:12px;display:flex;align-items:center;gap:6px}
.com-autor small{font-weight:400;color:var(--sub)}
.com-x{margin-left:auto;border:none;background:none;color:var(--sub);font-size:16px;line-height:1;padding:0 4px}
.com-texto{white-space:pre-wrap;line-height:1.4;margin-top:2px;user-select:text;-webkit-user-select:text}
.com-res{font-size:12px;color:#1E9E50;font-weight:600;margin-top:6px}
.com-fio textarea{width:100%;border:1px solid var(--borda);border-radius:8px;padding:8px;background:var(--fundo);color:var(--tx);font:inherit;resize:vertical;outline:none}
.com-acoes{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.com-acoes small{color:var(--sub);font-size:11px}
.com-enviar{border:none;border-radius:8px;background:var(--azul);color:#F4EBD3;padding:7px 12px;font-weight:600}
[data-tema="escuro"] .com-enviar{background:var(--ouro);color:var(--azul)}
.com-enviar:disabled{opacity:.4}
.excalidraw .tb-comentar{border:none;background:transparent;padding:0;margin:0;cursor:pointer;color:var(--icon-fill-color);position:relative}
.excalidraw .tb-comentar .ToolIcon__icon{display:flex;align-items:center;justify-content:center}
.excalidraw .tb-comentar .ToolIcon__icon svg{width:var(--icon-size,1rem);height:var(--icon-size,1rem)}
.excalidraw .tb-comentar:hover .ToolIcon__icon{background:var(--button-hover-bg,var(--color-surface-mid))}
.excalidraw .tb-comentar.ativo .ToolIcon__icon{background:var(--color-primary-light,#e0dfff)}
.excalidraw .tb-comentar[data-n]:not([data-n=""])::after{content:attr(data-n);position:absolute;top:-2px;right:-2px;min-width:15px;height:15px;border-radius:8px;
  background:#C9A227;color:#0F1B33;font:700 9px/15px -apple-system,sans-serif;text-align:center;padding:0 3px}
.ver-item{border-bottom:1px solid var(--borda)}
.ver-previa{display:block;max-width:100%;margin:0 0 10px;border:1px solid var(--borda);border-radius:8px;background:#fff}

/* ---------- apresentação ---------- */
#telaEditor:fullscreen{background:#000}
.ed-palco.apresentando .layer-ui__wrapper,.ed-palco.apresentando .App-bottom-bar,.ed-palco.apresentando .layer-ui__wrapper__footer-left,.ed-palco.apresentando .layer-ui__wrapper__footer-right,.ed-palco.apresentando .App-menu{display:none!important}
.mascara-slide{position:absolute;z-index:3;pointer-events:none;box-shadow:0 0 0 300vmax #000;border-radius:1px}
.ap-controles{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:4px;
  background:rgba(15,27,51,.82);color:#F4EBD3;border-radius:14px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:.35;transition:opacity .2s}
.ap-controles:hover,.ap-controles:focus-within{opacity:1}
@media (hover:none){.ap-controles{opacity:.85}}
.ap-controles button{width:42px;height:42px;border:none;border-radius:10px;background:transparent;color:inherit;display:flex;align-items:center;justify-content:center}
.ap-controles button:disabled{opacity:.3}
.ap-controles button.ativo{background:#C9A227;color:#0F1B33}
.ap-controles button svg{width:22px;height:22px}
.ap-n{min-width:64px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.ap-sep{width:1px;height:26px;background:rgba(255,255,255,.2);margin:0 4px}
.tb-topo .tb-play{background:var(--ouro)!important;color:var(--azul)!important}

/* ---------- painel de slides ---------- */
.modal .dica{margin:0 0 12px;color:var(--sub);line-height:1.45;font-size:14px}
.sl-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--borda);flex-wrap:wrap}
.sl-n{width:22px;text-align:center;font-weight:700;color:var(--ouro)}
.sl-mini{width:72px;height:44px;object-fit:contain;background:#fff;border:1px solid var(--borda);border-radius:6px;flex:none}
.sl-tx{flex:1;min-width:150px}.sl-tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sl-tx small{color:var(--sub);font-size:11px}
.sl-bts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.sl-bts .bt{padding:6px 9px!important;min-width:32px}
.sl-bts .bt:disabled{opacity:.35}

/* ---------- cores ampliadas ---------- */
.tb-cores{margin-top:6px}
.tb-sv{position:relative;height:120px;border-radius:8px;overflow:hidden;touch-action:none;cursor:crosshair}
.tb-sv canvas{width:100%;height:100%;display:block}
.tb-sv-alvo{position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 4px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
.tb-matiz{position:relative;height:14px;margin:12px 6px 4px;border-radius:7px;touch-action:none;cursor:pointer;
  background:linear-gradient(to right,#f00,#ff0 17%,#0f0 33%,#0ff 50%,#00f 67%,#f0f 83%,#f00)}
.tb-matiz-alvo{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 4px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
.tb-cores-linha{display:flex;align-items:center;gap:6px;margin-top:10px}
.tb-amostra{width:30px;height:30px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.tb-hex{flex:1;min-width:0;height:32px;border:1px solid var(--default-border-color,#ddd);border-radius:8px;padding:0 8px;font:600 13px ui-monospace,Menlo,monospace;background:var(--input-bg-color,#fff);color:var(--text-primary-color,#1b1b1f);outline:none}
.tb-gotas{width:32px;height:32px;border:1px solid var(--default-border-color,#ddd);border-radius:8px;background:transparent;color:var(--icon-fill-color,#333);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.tb-gotas svg{width:16px;height:16px}
.tb-grupo{margin-top:8px}.tb-grupo.vazio{display:none}
.tb-amostras{display:flex;flex-wrap:wrap;gap:6px}
.tb-am{width:22px;height:22px;border-radius:6px;border:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);padding:0;cursor:pointer}
.excalidraw .color-picker-content{max-height:min(80vh,640px);overflow-y:auto}

/* ---------- editor ---------- */
#telaEditor{position:fixed;inset:0;top:env(safe-area-inset-top,0px);background:var(--regua)}
#telaEditor:fullscreen{top:0}
.ed-palco{position:absolute;inset:0}
.ed-palco.com-reguas{left:20px;top:20px}
.regua{position:absolute;background:var(--regua);z-index:2;display:block}
.regua.h{left:20px;top:0;right:0;height:20px;border-bottom:1px solid var(--regua-risco)}
.regua.v{left:0;top:20px;bottom:0;width:20px;border-right:1px solid var(--regua-risco)}
.regua-canto{position:absolute;left:0;top:0;width:20px;height:20px;background:var(--regua);border-right:1px solid var(--regua-risco);border-bottom:1px solid var(--regua-risco);z-index:3;
  font-size:8px;color:var(--regua-tx);display:flex;align-items:center;justify-content:center}
