<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<script>/* VERSÃO DO APP — a busca automática de atualização compara com esta linha */

window.EXCALIDRAW_ASSET_PATH = ['https://esm.sh/@excalidraw/excalidraw@0.18.1/dist/prod/', 'https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@0.18.1/dist/prod/'];

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tábula</title>
<meta name="theme-color" content="#0F1B33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tábula">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#0F1B33; --ouro:#C9A227;
  --fundo:#F3EFE6; --barra:#0F1B33; --barra-tx:#F4EBD3; --barra-sub:#A9B2C6;
  --painel:#FFFDF8; --tx:#1B2438; --sub:#6B6658; --borda:#E1DACB; --bt:#22314F;
  --sombra:0 10px 30px rgba(15,27,51,.16);
  --regua:#F7F4EC; --regua-tx:#7A7465; --regua-risco:#B9B2A2;
  --pontos:rgba(15,27,51,.22);
}
[data-tema="escuro"]{
  --fundo:#0A111F; --barra:#060C18; --painel:#17223A; --tx:#E9E4D6; --sub:#A7A08F; --borda:#2B3A57;
  --sombra:0 10px 30px rgba(0,0,0,.5);
  --regua:#121212; --regua-tx:#8C8C8C; --regua-risco:#4A4A4A;
  --pontos:rgba(255,255,255,.20);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--fundo);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
.oculto{display:none!important}

/* ---------- barra superior (tela das cenas) ---------- */
.barra{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
  background:var(--barra);color:var(--barra-tx);flex-wrap:wrap}
.marca{font-family:Cinzel,serif;font-weight:700;font-size:22px;color:var(--ouro);letter-spacing:.06em;margin-right:4px}
.versao{font-size:11px;color:var(--barra-sub)}
.barra .esp{flex:1}
.bt-ic{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:transparent;color:var(--barra-tx);
  display:inline-flex;align-items:center;justify-content:center;padding:0}
.bt-ic svg{width:20px;height:20px}
.bt-ouro{background:var(--ouro);color:var(--azul);border:none;border-radius:10px;padding:9px 14px;font-weight:600}
.busca{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--barra-tx);border-radius:10px;padding:8px 12px;width:200px;max-width:40vw;outline:none}
.busca::placeholder{color:var(--barra-sub)}

/* ---------- grade de cenas ---------- */
#telaCenas{position:fixed;inset:0;display:flex;flex-direction:column}
.rolagem{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px;padding-bottom:max(18px,env(safe-area-inset-bottom))}
.titulo-sec{font-family:"Cormorant Garamond",serif;font-size:22px;color:var(--sub);margin:2px 4px 14px;font-style:italic}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.cartao{background:var(--painel);border:1px solid var(--borda);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(15,27,51,.06);
  display:flex;flex-direction:column;cursor:pointer;position:relative}
.cartao:active{transform:scale(.99)}
.cartao .mini{aspect-ratio:16/10;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--borda)}
[data-tema="escuro"] .cartao .mini{background:#1E1E1E}
.cartao .mini img{width:100%;height:100%;object-fit:contain}
[data-tema="escuro"] .cartao .mini img{filter:invert(93%) hue-rotate(180deg)}
.cartao .mini .vazio{color:var(--sub);font-family:"Cormorant Garamond",serif;font-style:italic;font-size:18px}
.cartao .info{padding:10px 12px;display:flex;align-items:center;gap:6px}
.cartao .nome{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cartao .data{font-size:12px;color:var(--sub)}
.cartao .mais{width:32px;height:32px;border:none;background:transparent;border-radius:8px;color:var(--sub);flex:none}
.cartao .mais:hover{background:var(--borda)}
.cartao.nova{align-items:center;justify-content:center;border:2px dashed var(--borda);background:transparent;min-height:180px;color:var(--sub);font-weight:600;gap:8px}
.cartao.nova svg{width:34px;height:34px;color:var(--ouro)}
.vazio-lista{color:var(--sub);text-align:center;padding:40px 10px}

/* ---------- menus, modais, aviso ---------- */
.fundo-modal{position:fixed;inset:0;background:rgba(6,12,24,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--painel);color:var(--tx);border-radius:16px;box-shadow:var(--sombra);width:min(440px,100%);max-height:85vh;overflow:auto;padding:18px}
.modal h2{font-family:Cinzel,serif;font-size:18px;margin:0 0 12px;color:var(--tx)}
.modal .campo{width:100%;padding:10px 12px;border:1px solid var(--borda);border-radius:10px;background:var(--fundo);color:var(--tx);outline:none}
.modal .acoes{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.modal .bt{border:1px solid var(--borda);background:transparent;border-radius:10px;padding:9px 14px}
.modal .bt.pri{background:var(--azul);color:#fff;border-color:var(--azul)}
[data-tema="escuro"] .modal .bt.pri{background:var(--ouro);color:var(--azul);border-color:var(--ouro)}
.modal .bt.perigo{background:#B03A2E;color:#fff;border-color:#B03A2E}
.menu-flut{position:fixed;z-index:60;background:var(--painel);color:var(--tx);border:1px solid var(--borda);border-radius:12px;box-shadow:var(--sombra);padding:6px;min-width:190px}
.menu-flut button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:10px 12px;border-radius:8px}
.menu-flut button:hover{background:var(--fundo)}
.menu-flut .perigo{color:#C0392B}
.menu-flut .info{font-size:12px;color:var(--sub);padding:6px 12px}
.linha-aj{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--borda)}
.linha-aj:last-child{border-bottom:none}
.linha-aj .tx{flex:1;min-width:0}
.linha-aj small{color:var(--sub);display:block;overflow:hidden;text-overflow:ellipsis}
.selo{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--borda);color:var(--sub)}
.selo.ok{background:#1E9E50;color:#fff}
#aviso{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(calc(100% + 60px));z-index:80;visibility:hidden;
  background:var(--azul);color:#F4EBD3;padding:11px 14px;border-radius:12px;box-shadow:var(--sombra);display:flex;gap:12px;align-items:center;
  transition:transform .25s;max-width:92vw;font-size:14px}
#aviso.vis{transform:translateX(-50%) translateY(0);visibility:visible}
#aviso button{background:var(--ouro);color:var(--azul);border:none;border-radius:8px;padding:7px 12px;font-weight:600;white-space:nowrap}

/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:40;background:var(--azul);display:flex;align-items:center;justify-content:center;padding:20px}
#login form{width:min(360px,100%);background:#FFFDF8;color:#1B2438;border-radius:18px;padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#login h1{font-family:Cinzel,serif;color:var(--azul);text-align:center;margin:0;font-size:30px;letter-spacing:.06em}
#login .lema{text-align:center;font-family:"Cormorant Garamond",serif;font-style:italic;color:#6B6658;margin:4px 0 18px;font-size:17px}
#login label{display:block;font-size:13px;color:#6B6658;margin:10px 0 4px}
#login .campo{width:100%;padding:11px 12px;border:1px solid #E1DACB;border-radius:10px;background:#F7F3EA;color:#1B2438;outline:none}
#login button[type=submit]{width:100%;margin-top:16px;background:var(--azul);color:#F4EBD3;border:none;border-radius:10px;padding:12px;font-weight:600}
#login .link{display:block;margin:12px auto 0;background:none;border:none;color:var(--azul);text-decoration:underline;font-size:14px}
#login .erro{color:#B03A2E;font-size:13px;margin-top:10px;min-height:18px;text-align:center}
#login .ok{color:#1E9E50}
#login .ver{text-align:center;font-size:11px;color:#9A9384;margin-top:6px}

/* ---------- editor ---------- */
#telaEditor{position:fixed;inset:0;background:var(--regua)}
.ed-palco{position:absolute;inset:0}
.ed-palco.com-reguas{left:20px;top:20px}
.regua{position:absolute;background:var(--regua);z-index:2;display:block}
.regua.h{left:20px;top:0;right:0;height:20px;border-bottom:1px solid var(--regua-risco)}
.regua.v{left:0;top:20px;bottom:0;width:20px;border-right:1px solid var(--regua-risco)}
.regua-canto{position:absolute;left:0;top:0;width:20px;height:20px;background:var(--regua);border-right:1px solid var(--regua-risco);border-bottom:1px solid var(--regua-risco);z-index:3;
  font-size:8px;color:var(--regua-tx);display:flex;align-items:center;justify-content:center}
.pontos{position:absolute;inset:0;pointer-events:none;z-index:2}
.tb-topo{display:flex;align-items:center;gap:6px}
.tb-topo .tb-bt{height:36px;min-width:36px;border-radius:8px;border:none;background:var(--island-bg-color,#fff);color:var(--icon-fill-color,#1b1b1f);
  box-shadow:0 0 0 1px var(--color-surface-lowest,#ececf4),var(--shadow-island,0 1px 3px rgba(0,0,0,.1));display:inline-flex;align-items:center;justify-content:center;padding:0 8px;gap:4px;font-size:13px}
.tb-topo .tb-bt svg{width:18px;height:18px}
.tb-titulo{height:36px;width:170px;border-radius:8px;border:none;padding:0 10px;background:var(--island-bg-color,#fff);color:var(--text-primary-color,#1b1b1f);
  box-shadow:0 0 0 1px var(--color-surface-lowest,#ececf4),var(--shadow-island,0 1px 3px rgba(0,0,0,.1));outline:none;font-weight:600}
.tb-st{width:10px;height:10px;border-radius:50%;background:#1E9E50;flex:none}
.tb-st.salvando{background:var(--ouro)} .tb-st.pend{background:#E67E22} .tb-st.erro{background:#C0392B}
.tb-ver{font-size:11px;color:var(--color-gray-50,#888);padding:0 2px}
.HelpDialog__header{display:none!important}
.excalidraw .welcome-screen-center__logo .tb-logo{font-family:Cinzel,serif;font-size:42px;color:var(--ouro);letter-spacing:.08em}
</style>
</head>
<body>
<div id="telaCenas" class="oculto"></div>
<div id="telaEditor" class="oculto"></div>
<div id="aviso"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
